name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: ./scripts/check-api-clock.sh
      - run: dotnet test tests/PatientDataPortal.Api.Tests/PatientDataPortal.Api.Tests.csproj
